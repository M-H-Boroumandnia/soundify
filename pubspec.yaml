name: soundify
description: Soundify, an online music streaming app built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  provider: ^6.1.5+1
  cached_network_image: ^4.0.7
  safe_device: ^1.4.1
  google_fonts: ^9.0.0
  smooth_page_indicator: ^3.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
